name: Proposer un article 📝
description: Proposez ici votre article de blog pour le HackLab !
labels: ["article", "review-needed"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Merci de remplir le _titre de l'issue_ sous la forme suivante :**  
        `Nouvel article: [Votre pseudo] - [Nom de l'article]`
  - type: input
    id: title
    attributes:
      label: Titre de l'Article
      placeholder: "Ex: Analyse d'une faille CVE-2025-0001"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Catégorie
      description: |
        Offensif : attaque, pentest, exploitation, maldev, red team.
        Défensif : détection, SOC, forensique, réponse à incident, durcissement.
        Gouvernance : risques, conformité, droit, organisation, gestion de crise.
      options:
        - Offensif
        - Défensif
        - Gouvernance
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Courte description de l'article (1 ou 2 phrases)
      placeholder: "Cet article explique comment exploiter..."
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Contenu complet (en Markdown)
      description: "Pour ajouter une image, glissez le fichier dans ce champ : elle sera copiée sur le site (PNG, JPEG, GIF ou WebP, 5 Mo maximum par image)."
      placeholder: |
        ## Introduction
        Voici comment exploiter une vulnérabilité...
        
        ## Méthodologie
        ...
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: Auteur
      placeholder: "Ex: HackLab ESGI"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (séparés par des virgules)
      description: 3 à 5 mots-clés précis. Reprenez les tags déjà utilisés sur le site quand ils conviennent (« forensic » plutôt que « forensique »).
      placeholder: "web, reverse, retex"
    validations:
      required: true
